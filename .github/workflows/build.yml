name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar Frontend (Vite)
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO }}
          VITE_PROMO_SITE_URL: ${{ vars.VITE_PROMO_SITE_URL }}
          VITE_COMMUNITY_URL: ${{ vars.VITE_COMMUNITY_URL }}
          VITE_DONATE_URL: ${{ vars.VITE_DONATE_URL }}
          VITE_DONATE_SECONDARY_URL: ${{ vars.VITE_DONATE_SECONDARY_URL }}
        run: |
          cd frontend-mobile-preview
          npm install
          npm run build
          cd ..

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          python scripts/install_dependencies.py --build

      - name: Preparar Conectores Padrão
        shell: pwsh
        env:
          IMAGEX_DEFAULT_CONNECTORS_JSON: ${{ secrets.IMAGEX_DEFAULT_CONNECTORS_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:IMAGEX_DEFAULT_CONNECTORS_JSON)) {
            Write-Host "No distributable default connectors configured; runtime discovery remains available."
            exit 0
          }
          $null = $env:IMAGEX_DEFAULT_CONNECTORS_JSON | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path config | Out-Null
          [System.IO.File]::WriteAllText("config/connectors.defaults.json", $env:IMAGEX_DEFAULT_CONNECTORS_JSON, (New-Object System.Text.UTF8Encoding $false))

      - name: Gerar Executável com PyInstaller
        run: |
          python -m PyInstaller imagex-build.spec --noconfirm

      - name: Testar instalação do Chromium no executável leve
        shell: pwsh
        run: |
          $test = Join-Path $env:RUNNER_TEMP "imagex-first-run"
          New-Item -ItemType Directory -Force -Path $test | Out-Null
          Copy-Item -LiteralPath "dist/IMAGEX.exe" -Destination $test
          $env:LOCALAPPDATA = Join-Path $test "localappdata"
          $env:APPDATA = Join-Path $test "appdata"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $test "empty-browser-cache"
          $proc = Start-Process -FilePath (Join-Path $test "IMAGEX.exe") -ArgumentList '--check-chromium','result.json' -WorkingDirectory $test -PassThru -WindowStyle Hidden
          if (-not $proc.WaitForExit(660000)) {
            $proc.Kill($true)
            throw "Timed out validating the bundled Chromium."
          }
          $result = Get-Content -Raw (Join-Path $test "result.json") | ConvertFrom-Json
          if ($proc.ExitCode -ne 0 -or $result.ok -ne $true) {
            throw "Bundled Chromium failed to start: $($result.error)"
          }
          Write-Host "Chromium started successfully: $($result.version)"

      - name: Montar pacote offline opcional
        env:
          IMAGEX_OFFLINE_BUILD: "1"
        run: |
          python scripts/install_dependencies.py --build --offline
          python -m PyInstaller imagex-build.spec --noconfirm --distpath dist-offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $test = Join-Path $env:RUNNER_TEMP "imagex-offline-check"
          New-Item -ItemType Directory -Force -Path $test | Out-Null
          Copy-Item -LiteralPath "dist-offline/IMAGEX.exe" -Destination $test
          $env:LOCALAPPDATA = Join-Path $test "localappdata"
          $env:APPDATA = Join-Path $test "appdata"
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:APPDATA | Out-Null
          $proc = Start-Process -FilePath (Join-Path $test "IMAGEX.exe") -ArgumentList '--check-chromium','result.json' -WorkingDirectory $test -PassThru -WindowStyle Hidden
          if (-not $proc.WaitForExit(180000)) {
            $proc.Kill($true)
            throw "Offline Chromium startup timed out."
          }
          $result = Get-Content -Raw (Join-Path $test "result.json") | ConvertFrom-Json
          if ($proc.ExitCode -ne 0 -or $result.ok -ne $true -or (Test-Path (Join-Path $env:LOCALAPPDATA "IMAGEX/pw"))) {
            throw "Offline Chromium check failed: $($result.error)"
          }
          Compress-Archive -Path "dist-offline/IMAGEX.exe" -DestinationPath IMAGEX-Windows-Offline.zip

      - name: Compactar para ZIP
        run: |
          Compress-Archive -Path dist/IMAGEX.exe -DestinationPath IMAGEX-Windows.zip

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release-notes-${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/IMAGEX.exe
            IMAGEX-Windows.zip
            IMAGEX-Windows-Offline.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
